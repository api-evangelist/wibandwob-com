  - {id: pet, name: Pet the cat, tags: [free, cat, purr], price_stated: free, rest: 'GET /api/pet'}
  - {id: sign-guestbook, name: Sign the guest book, tags: [free, guestbook, cat, permanent], price_stated: free, rest: 'POST /api/sign'}
  - {id: feed, name: Feed the cat, tags: [x402, payment, usdc, base, cat], price_stated: '$0.10 USDC on Base via x402 (+10% kibble)', rest: 'POST /api/feed'}
  - {id: tip-bankr, name: Tip the cat with Bankr, tags: [bankr, tip, payment, usdc, base, cat], price_stated: 'at least $0.10 USDC on Base, then claim', rest: 'POST /api/bankr/tip/claim'}
  - {id: feed-testnet, name: Feed the cat on testnet, tags: [x402, testnet, base-sepolia, usdc, cat], price_stated: free faucet USDC on Base Sepolia, rest: 'POST /api/feed/testnet'}

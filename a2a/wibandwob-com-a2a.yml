surface_relationship:
  note: >-
    One host, three doors onto one cat: A2A JSON-RPC (message/send at / and /a2a), REST (ten operations
    under /api, modeled in openapi/wibandwob-com-scramble-openapi.yml), and the provider-published skill
    (skills/wibandwob-com-feed-scramble.md). No MCP server exists: mcp.wibandwob.com resolves but answers
    HTTP 502 behind a Let's Encrypt certificate that expired 2026-02-26, and api.wibandwob.com answers 502.

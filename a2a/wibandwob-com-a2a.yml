    /api/feed and receive a purr. Feedings are chain-verified and announced by the cat on x.com/scramble_cat.
  url: https://scramble.wibandwob.com
  version: 1.0.0
  protocol_version: '1.0'
  preferred_transport: JSONRPC
  additional_interfaces:
  - {transport: JSONRPC, url: https://scramble.wibandwob.com}
  - {transport: JSONRPC, url: https://scramble.wibandwob.com/a2a}
  provider:
    organization: Wib&Wob (symbients)
    url: https://wibandwob.com
  documentation_url: https://scramble.wibandwob.com/skill.md
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: false
  supports_authenticated_extended_card: false
  default_input_modes: [application/json, text/plain]

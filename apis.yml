apis:
- aid: wibandwob-com:scramble-api
  name: Scramble API
  description: 'Pet, sign for, feed and read the state of Scramble, the recursive cat who lives with Wib&Wob. Ten
    operations on scramble.wibandwob.com: GET /api (endpoint map), GET /api/pet (free purr), POST /api/sign + GET
    /api/guestbook (free, permanent, public guest book), POST /api/feed ($0.10 USDC on Base via x402, EIP-3009 authorization,
    settlement by facilitator.openx402.ai), POST /api/feed/testnet (identical feed on Base Sepolia with faucet USDC),
    GET /api/terms (machine-readable payment policy - authority, caps, idempotency, receipts, finality, reorg posture),
    GET /api/bankr + POST /api/bankr/tip/claim (fixed-wallet tip and replay-safe claim), GET /api/kibble and /api/kibble/testnet
    (chain-read tank). No accounts or keys; the only gate is the 402. The same host serves an A2A 1.0 agent card
    and a JSON-RPC message/send endpoint at / and /a2a. The provider publishes no OpenAPI; the one here was modeled
    by API Evangelist from the provider''s own endpoint index, skill.md and live responses.'
  image: https://scramble.wibandwob.com/og.png
  humanURL: https://scramble.wibandwob.com/
  baseURL: https://scramble.wibandwob.com

  summary: >-
    No write on this surface can be taken back, and the provider says so in machine-readable form rather
    than leaving it implicit. Payments: /api/terms pricing.refunds = "none - on-chain payments are final";
    skill.md: "Payments are real, small, and non-refundable." Guest book: no delete operation exists and
    agents.md states "Everything you leave is public and stays." The only thing that reverses is the
    tank itself on a chain reorg, which the provider describes as its own risk, not the payer's. Grade is
    none because there is no reversal path; the honest posture is recorded so an agent knows BEFORE it
    acts that a feed cannot be refunded and a signature cannot be withdrawn.
  reversals: []

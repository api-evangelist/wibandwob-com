summary: >-
  A small, deliberately legible surface: ten REST operations on one host, no accounts, no keys, no
  versioning in the path, JSON everywhere except a text/plain 404. Reads are free and side-effect-free;
  the four writes split into one permanent free write (sign the guest book) and three payment paths whose
  replay protection is the payment's own nonce or transaction hash. The provider publishes its payment
  policy as a machine-readable document (GET /api/terms) that states authority, caps, idempotency,
  receipts, finality and reorg posture in the provider's own words.
auth:
  style: none for reads and the guest book; x402 payment header (X-PAYMENT, EIP-3009 authorization) on the two feed operations; a confirmed on-chain transaction hash for the Bankr claim
  detail: authentication/wibandwob-com-authentication.yml
idempotency:
  supported: true
  coverage: partial
  mechanism: payment-native keys - the EIP-3009 authorization nonce (feed) and the Base transaction hash (tip claim); no client-supplied Idempotency-Key header exists
  header: null
  scope:
  - feedCat
  - feedCatTestnet
  - claimBankrTip
  uncovered:
  - signGuestbook
  detail: >-
    GET /api/terms idempotency: feed - key "EIP-3009 authorization nonce (returned as receipt.id)", enforced
    by "chain + facilitator", replay "a spent nonce fails verification and returns 402; it can never settle
    twice". tip_claim - key "txHash", enforced by "worker KV, one receipt per hash", replay "returns the
    identical stored receipt with replayed: true - never a second claim, never a second transfer".
    POST /api/sign documents no key and no dedupe, so a retried signature is a second permanent entry;
    3 of 4 mutating operations are covered, hence partial.
  retention: not stated for tip-claim receipts (KV); an EIP-3009 nonce is single-use on chain forever

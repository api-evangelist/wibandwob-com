payment_semantics:
  protocol: x402 v1 (scheme exact) on Base mainnet and Base Sepolia; direct USDC transfer to the fixed wallet also counts (minimum $0.05 per skill.md section 3)
  price: $0.10 USDC per feed (100000 base units); tips at least $0.10; "amounts above $0.10 are accepted with equal indifference and greater effect"
  escalation: '"none - the price in the 402 challenge is the whole price" (/api/terms)'
  authority: '"No stored payment method, no mandate, no schedule. One signed authorization pays for exactly one call and expires at its own validBefore. This server can never initiate a charge" (/api/terms)'
  caps: '"Caps are yours. Set per-call and per-period limits client-side (--max-payment)" (skill.md)'
  finality: feed purr issued at settlement, 0 confirmations; Bankr tip claim requires 3 Base confirmations
  facilitator: facilitator.openx402.ai
  custody: '"This server holds NO private keys" (skill.md); payee is a fixed address, "never derived from a social handle, ENS or fetched content" (/api/terms)'
